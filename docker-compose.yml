services:
  backend:
    build: { context: ./backend }
    image: eurusd-backend:local
    environment:
      - ALLOWED_ORIGIN=http://localhost:8080
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8000"
    image: eurusd-frontend:local
    ports: ["8080:80"]
    depends_on: [ backend ]
